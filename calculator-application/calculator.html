<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="result" readonly>
        <div class="calculator-btns">
            <!-- with the clear default value is AC then when clicked  -->
            <button class="All-Clear diff-color">AC</button>
            <button class="operator diff-color"> +/- </button>
            <button class="operator diff-color">%</button>
            <button class="operator"> ÷ </button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator"> x </button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator"> - </button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator"> + </button>
            <button class="number zero-span">0</button>
            <button class="decimal">.</button>
            <button class="equals">=</button>
        </div>
    </div>
    <!-- note always build the backend first before building the fronted so take note
      -->
    <script src="index.js"></script>
</body>
</html>
