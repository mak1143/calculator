<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="calculator">
            <input type="text" id="result" readonly>
            <div class="calculator-btns">
                <button class="top-op" id="ac">AC</button>
                <button class="top-op" id="sign">+/-</button>
                <button class="top-op" id="pct">%</button>
                <button class="op" id="div">÷</button>
                <button class="num">7</button>
                <button class="num">8</button>
                <button class="num">9</button>
                <button class="op" id="mul">×</button>
                <button class="num">4</button>
                <button class="num">5</button>
                <button class="num">6</button>
                <button class="op" id="sub">−</button>
                <button class="num">1</button>
                <button class="num">2</button>
                <button class="num">3</button>
                <button class="op" id="add">+</button>
                <button class="num zero-span">0</button>
                <button class="decimal">.</button>
                <button class="equals">=</button>
            </div>
        </div>
        <aside class="sidebar">
            <section class="about">
                <h2>About</h2>
                <p>A desktop calculator built with Python/Tkinter and a web version with HTML, CSS, and JavaScript. Dark theme, 4-column grid layout.</p>
            </section>
            <section class="release">
                <h2>Release Date</h2>
                <p>2026-08-03</p>
            </section>
            <section class="packages">
                <h2>Packages</h2>
                <ul>
                    <li><strong>calculator</strong> v0.1.0</li>
                    <li>tk ≥0.1.0</li>
                    <li>Python ≥3.11</li>
                </ul>
            </section>
        </aside>
    </div>
    <script src="index.js"></script>
</body>
</html>
